<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/x-icon" href="Images/Top.png">
    <link rel="stylesheet" href="CSS/TradeValues.css">
    <link rel="stylesheet 2" href="CSS/Main.css">
    <link href='https://fonts.googleapis.com/css?family=Fredoka One' rel='stylesheet'>
    <script type="module" src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database.js"></script>    
    <script type="module" src="JavaScript/Admin.js"></script>
    <script src="JavaScript/Main.js"></script>
    <title>Trade Values - Admin Panel</title>
</head>
<body>
    <!-- Back Button -->
    <div style="padding: 20px;">
        <a href="Games.html" >&lt; Back</a>
        <a href="TradeValues.html" >&lt; Trade Values</a>
    </div>

    <main>
        <section id="main">
            <div class="container">
                <div class="filters">
                    <label for="category">Select Category:</label>
                    <select id="category">
                        <option value="Pets" selected>Pets</option>
                        <option value="Toys">Toys</option>
                    </select>

                    <label for="itemFilter">Select Item:</label>
                    <select id="itemFilter">
                        <!-- Dynamic items will be populated here -->
                    </select>
                </div>

                <div id="itemDetails" style="display: none;">
                    <h3>Item Details</h3>
                    <div id="inputs">
                        <!-- Inputs for editing the selected item will appear here -->
                    </div>
                    <button id="updateButton">Update</button>
                </div>
            </div>
        </section>
    </main>

    <script src="JavaScript/AdminPanel.js"></script>
</body>
</html>
