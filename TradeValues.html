<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/x-icon" href="Images/Top.png">
    <link rel="stylesheet" href="CSS/TradeValues.css">
    <link rel="stylesheet 2" href="CSS/Main.css">
    <link href='https://fonts.googleapis.com/css?family=Fredoka One' rel='stylesheet'>

    <script type="module" src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database.js"></script>

    <script type="module" src="JavaScript/TradeValues.js"></script>
    <script src="JavaScript/Main.js"></script>
    
    <title>Trade Values</title>
</head>
<body>
    <!-- Back Button -->
    <div style="padding: 20px;">
        <a href="Games.html" >&lt; Back</a>
    </div>

    <main>
        <section id="main">
            <div class="container">
                <div class="filters">
                    <label for="category">Select Category:</label>
                    <select id="category" onchange="loadItems()">
                        <option value="pets" selected>Pets</option>
                        <option value="toys">Toys</option>
                    </select>

                    <label for="tagFilter">Filter by Tag:</label>
                    <select id="tagFilter" onchange="loadItems()">
                        <option value="">All</option>
                        <option value="halloween">Halloween</option>
                        <option value="christmas">Christmas</option>
                    </select>
                </div>

                <div class="cards" id="items-list">
                    <!-- Items will be dynamically populated here -->
                </div>
            </div>
        </section>
    </main>
</body>
</html>
